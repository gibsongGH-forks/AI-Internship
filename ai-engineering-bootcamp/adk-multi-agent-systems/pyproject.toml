[project]
name = "adk-multi-agent-systems"
version = "0.1.0"
description = "Multi-agent AI systems with Google ADK — routing, MCP, and A2A demos"
requires-python = ">=3.12"

dependencies = [
    "google-adk[mcp]>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk>=0.2.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0",
]

[tool.setuptools]
py-modules = ["demo1_routing", "demo2_mcp", "demo3_full_system", "shipping_agent", "streamlit_app"]

